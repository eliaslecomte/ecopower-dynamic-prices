name: HACS Validation
on: [push, pull_request]
jobs:
  hacs_validation:
    runs-on: ubuntu-latest
    name: HACS Validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration # Change to 'plugin', 'theme', etc.
